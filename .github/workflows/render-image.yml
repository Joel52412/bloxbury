name: Build render image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/render.Dockerfile", ".github/workflows/render-image.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the PyTorch base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/render.Dockerfile
          push: true
          tags: |
            ghcr.io/joel52412/bloxbury-render:5.3
            ghcr.io/joel52412/bloxbury-render:latest
